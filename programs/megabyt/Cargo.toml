[package]
name = "megabyt"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "megabyt"

[features]
# SEGURO POR PADRÃO: `default` NÃO inclui `testing`. Um `anchor build` /
# `cargo build` cru produz o binário de produção (VRF Switchboard real, sem
# fallback determinístico). Os testes ligam a feature explicitamente:
#   make test        -> anchor test -- --features testing
#   make test-rust    -> cargo test --lib   (os testes Rust não dependem da feature)
# Ver DEPLOY.md e scripts/verify-no-testing.sh.
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
testing = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
solana-program = "2.2"
switchboard-on-demand = "0.11.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

